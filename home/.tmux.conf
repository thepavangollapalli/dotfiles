# ============================================================================
# ~/.tmux.conf — managed by ~/code/dotfiles
# ============================================================================

# Terminal -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-features ",*:hyperlinks"
# Refresh color preferences from the attaching terminal, including when unset.
set -ag update-environment " COLORTERM NO_COLOR"
set -g escape-time 10
set -g focus-events on

# Behaviour ------------------------------------------------------------------
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi
set -g status-interval 5

# Prefix ---------------------------------------------------------------------
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Splits ---------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Panes ----------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows --------------------------------------------------------------------
bind -r C-h previous-window
bind -r C-l next-window

# Copy / clipboard -----------------------------------------------------------
# Let mouse-aware apps handle scrolling and selection; prefix + [ opens history.
bind -n WheelUpPane if -F -t = '#{pane_in_mode}' 'send-keys -X -t = -N 3 scroll-up' 'if -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e -t = ; send-keys -X -t = -N 3 scroll-up"'
bind -n MouseDrag1Pane if -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -M -t ='
# Keep the viewport in place after dragging; y or Enter copies and returns live.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind / copy-mode \; command-prompt -T search -p "Search history" { send-keys -X search-backward -- "%%" }

# Reload ---------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Status ---------------------------------------------------------------------
# One Dark tones sit just below Ghostty's default #282c34 background. Amber stays
# reserved for agents awaiting the user, so no window accent is yellow or orange.
set -g status-style "bg=#21252b,fg=#9da5b4"
set -g message-style "bg=#353b45,fg=#e6e6e6"
set -g message-command-style "bg=#353b45,fg=#e6e6e6"
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"
set -g status-left " "
set -g status-right "#[fg=#5c6370]%a %d %b  #[fg=#abb2bf,bold]%H:%M "
set -g status-right-length 60
set -g window-status-separator " "
# Each window keeps a stable accent from its index: blue, purple, green, pink, cyan.
set -g @window_accent '#{?#{==:#{e|m:#{window_index},5},0},#61afef,#{?#{==:#{e|m:#{window_index},5},1},#c678dd,#{?#{==:#{e|m:#{window_index},5},2},#98c379,#{?#{==:#{e|m:#{window_index},5},3},#e06c75,#56b6c2}}}}'
# Harness hooks own pane state. Requests take color priority over finished turns,
# then the window's accent. The spinner follows any running agent.
set -g @agent_needs_input '#{m:*needs_input*,#{P:#{@agent_state} }}'
set -g @agent_done '#{m:*done*,#{P:#{@agent_state} }}'
set -g @agent_running '#{m:*running*,#{P:#{@agent_state} }}'
# Filled chips use dark text. Finished turns stay dim even in the current window.
set -g @window_filled '#{?#{E:@agent_needs_input},1,#{?#{E:@agent_done},0,#{window_active}}}'
# A request pulses dark on a filled amber chip every 1.6 seconds. A finished turn
# shows a still green check on a slate chip, so it differs from a request in hue,
# shape, and motion. The spinner turns every 100ms.
set -g @agent_request_pulse '#{A/2:#[fg=#21252b]●,#[fg=#393835]●,#[fg=#524c3f]●,#[fg=#6a5f49]●,#[fg=#837253]●,#[fg=#6a5f49]●,#[fg=#524c3f]●,#[fg=#393835]●}'
set -g @agent_done_mark '#[fg=#98c379]#[bold]✓'
set -g @agent_spinner '#[fg=#{?#{E:@window_filled},#21252b,#{E:@window_accent}}]#{A:⣾,⣽,⣻,⢿,⡿,⣟,⣯,⣷}'
set -g @agent_indicator '#{?#{E:@agent_needs_input},#{E:@agent_request_pulse} ,#{?#{E:@agent_done},#{E:@agent_done_mark} ,}}#{?#{E:@agent_running},#{E:@agent_spinner} ,}'
set -g @window_chip_style '#{?#{E:@agent_needs_input},#[bg=#e5c07b],#{?#{E:@agent_done},#[bg=#3e4452],#{?window_active,#[bg=#{E:@window_accent}],}}}'
set -g @window_index_style '#{?#{E:@window_filled},#[fg=#21252b]#[bold],#{?#{E:@agent_done},#[fg=#9da5b4],#[fg=#5c6370]}}'
set -g @window_name_style '#{?#{E:@window_filled},#[fg=#21252b]#[bold],#{?#{E:@agent_done},#[fg=#e6e6e6]#[bold],#[fg=#{E:@window_accent}]}}'
set -g @window_label '#{E:@window_chip_style} #{E:@agent_indicator}#{E:@window_index_style}#I #{E:@window_name_style}#W '
set -g window-status-format "#{E:@window_label}"
set -g window-status-current-format "#{E:@window_label}"
# tmux 3.8 underlines the current window by default; the chip replaces that.
set -g window-status-current-style "default"
# Viewing a window acknowledges finished turns in all of its split panes. Requests
# stay until the agent resumes, and running panes keep their spinner.
set -g @agent_acknowledge '#{P:#{?#{==:#{@agent_state},done},set-option -pu -t #{pane_id} @agent_state; ,}}'
set-hook -g after-select-window[80] 'run-shell -C "#{E:@agent_acknowledge}"'
set-hook -g after-select-pane[80] 'run-shell -C "#{E:@agent_acknowledge}"'
set-hook -g client-focus-in[80] 'run-shell -C "#{E:@agent_acknowledge}"'
# Also acknowledge a click when the window or pane is already selected.
bind -n MouseDown1Pane { select-pane -t = ; run-shell -C '#{E:@agent_acknowledge}' ; send-keys -M }
bind -n MouseDown1Status { switch-client -t = ; run-shell -C '#{E:@agent_acknowledge}' }

# Session restore ------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'
