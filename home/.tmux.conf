# ============================================================================
# ~/.tmux.conf — managed by ~/code/dotfiles
# ============================================================================

# Terminal -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-features ",*:hyperlinks"
# Refresh color preferences from the attaching terminal, including when unset.
set -ag update-environment " COLORTERM NO_COLOR"
set -g escape-time 10
set -g focus-events on

# Behaviour ------------------------------------------------------------------
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi
set -g status-interval 5

# Prefix ---------------------------------------------------------------------
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Splits ---------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Panes ----------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows --------------------------------------------------------------------
bind -r C-h previous-window
bind -r C-l next-window

# Copy / clipboard -----------------------------------------------------------
# Let mouse-aware apps scroll themselves; prefix + [ always opens tmux history.
bind -n WheelUpPane if -F -t = '#{pane_in_mode}' 'send-keys -X -t = -N 3 scroll-up' 'if -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e -t = ; send-keys -X -t = -N 3 scroll-up"'
bind -n MouseDrag1Pane if -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M -t ='
# Keep the viewport in place after dragging; y or Enter copies and returns live.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind / copy-mode \; command-prompt -T search -p "Search history" { send-keys -X search-backward -- "%%" }

# Reload ---------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Status ---------------------------------------------------------------------
set -g status-style "bg=colour236,fg=colour250"
set -g status-left " #S "
set -g status-left-length 30
set -g status-right " %H:%M  %d-%b "
set -g status-right-length 60
# Harness hooks own pane state; presentation stays in dotfiles. Waiting takes
# priority across split panes, while the spinner follows any running agent.
set -g @agent_waiting '#{m:*waiting*,#{P:#{@agent_state} }}'
set -g @agent_running '#{m:*running*,#{P:#{@agent_state} }}'
set -g @agent_indicator '#{?#{E:@agent_waiting},ℹ ,}#{?#{E:@agent_running},#{A/2:⠋,⠙,⠹,⠸,⠼,⠴,⠦,⠧,⠇,⠏} ,}'
set -g @agent_window_label '#{?#{E:@agent_waiting},#[fg=colour214]#[bold],#{?#{E:@agent_running},#[fg=colour81],}}#{E:@agent_indicator}#I:#W'
set -g window-status-format " #{E:@agent_window_label} "
set -g window-status-current-format " #{E:@agent_window_label} "
set -g window-status-current-style "fg=colour81,bold"
set -g window-status-activity-style "fg=colour214"
# Viewing a window acknowledges completed agents in all of its split panes.
# Leave running panes alone so returning to work never hides its spinner.
set -g @agent_acknowledge '#{P:#{?#{==:#{@agent_state},waiting},set-option -pu -t #{pane_id} @agent_state; ,}}'
set-hook -g after-select-window[80] 'run-shell -C "#{E:@agent_acknowledge}"'
set-hook -g after-select-pane[80] 'run-shell -C "#{E:@agent_acknowledge}"'
set-hook -g client-focus-in[80] 'run-shell -C "#{E:@agent_acknowledge}"'
# Also acknowledge a click when the window or pane is already selected.
bind -n MouseDown1Pane { select-pane -t = ; run-shell -C '#{E:@agent_acknowledge}' ; send-keys -M }
bind -n MouseDown1Status { switch-client -t = ; run-shell -C '#{E:@agent_acknowledge}' }

# Session restore ------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'
